<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="EdgeOpenList —— 运行在 Cloudflare 边缘网络上的网盘聚合" />
    <title>EdgeOpenList</title>
    <script>
      // 在解析 CSS 之前就把主题定下来，否则深色模式用户每次刷新都会被一帧白屏闪瞎。
      // 与 src/composables/useTheme.ts 共用同一个 storage key。
      (function () {
        try {
          var m = localStorage.getItem("eol_theme") || "system";
          var dark =
            m === "dark" ||
            (m === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#17151a" : "#f7f4ef");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">EdgeOpenList 需要启用 JavaScript 才能运行。</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
